name: STREAKATHON CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Prisma Generate
      run: npx prisma generate

    - name: Lint Code
      run: npm run lint

    - name: Type Check
      run: npx tsc --noEmit

    # Uncomment when tests are added
    # - name: Run Tests
    #   run: npm test

    - name: Build Next.js
      run: npm run build
      env:
        # Dummy variables for build time checks if necessary
        DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        NEXTAUTH_SECRET: "dummy_secret"
        NEXTAUTH_URL: "http://localhost:3000"
